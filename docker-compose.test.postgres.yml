# docker-compose.test.postgres.yml — PostgreSQL integration test stack
#
# Runs the same integration tests as docker-compose.test.yml but against
# a real PostgreSQL database instead of SQLite.
#
# Ports (separate from the SQLite test stack to allow both running together):
#   API:        localhost:8002
#   PostgreSQL: localhost:5433
#   Qdrant:     localhost:6335
#
# Usage:
#   docker compose -f docker-compose.test.postgres.yml up -d --build
#   INTEGRATION_TESTS=1 MEMORY_API_URL=http://localhost:8002 pytest tests/integration/ -v
#   docker compose -f docker-compose.test.postgres.yml down -v
#
# Or via Makefile:
#   make test-integration-postgres
#
# Requires: Ollama with nomic-embed-text running on the host (port 11434).

version: '3.8'

services:
  agents-memory-test-postgres:
    build: .
    network_mode: host
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8002
    environment:
      - DB_BACKEND=postgres
      - DATABASE_URL=postgresql+psycopg://memory:memory@localhost:5433/memory_test
      - QDRANT_HOST=localhost
      - QDRANT_PORT=6335
      - QDRANT_COLLECTION=test_memory_pg
      - EMBEDDING_MODEL=nomic-embed-text
      - EMBEDDING_DIMENSION=768
      - OLLAMA_HOST=http://localhost:11434
      - BUFFER_RETENTION_DAYS=7
      - LOG_LEVEL=INFO
    depends_on:
      postgres-test:
        condition: service_healthy
    restart: "no"

  postgres-test:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=memory
      - POSTGRES_PASSWORD=memory
      - POSTGRES_DB=memory_test
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: "no"

  qdrant-test-postgres:
    image: qdrant/qdrant:latest
    ports:
      - "6335:6333"
    volumes:
      - test_qdrant_pg:/qdrant/storage
    restart: "no"

volumes:
  test_postgres_data:
  test_qdrant_pg:
