version: '3.8'

# Integration test stack — isolated from the production compose file.
#
# API runs on port 8001, Qdrant on port 6334.
# Ollama is expected to be running on the host (port 11434).
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d --build
#   INTEGRATION_TESTS=1 pytest tests/integration/ -v
#   docker compose -f docker-compose.test.yml down -v

services:
  agents-memory-test:
    build: .
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/test.db
      - QDRANT_HOST=qdrant-test
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=test_memory
      - EMBEDDING_PROVIDER=ollama
      - EMBEDDING_MODEL=nomic-embed-text
      - EMBEDDING_DIMENSION=768
      - OLLAMA_HOST=http://host.docker.internal:11434
      - BUFFER_RETENTION_DAYS=7
      - LOG_LEVEL=INFO
    volumes:
      - test_data:/app/data
    depends_on:
      - qdrant-test
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"

  qdrant-test:
    image: qdrant/qdrant:latest
    ports:
      - "6334:6333"
    volumes:
      - test_qdrant:/qdrant/storage
    restart: "no"

volumes:
  test_data:
  test_qdrant:
