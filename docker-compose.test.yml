version: '3.8'

# Integration test stack — isolated from the production compose file.
#
# API uses host network mode so it can reach Ollama on localhost:11434.
# Qdrant-test runs in its own network, mapped to host port 6334.
# API listens on host port 8001 (uvicorn started with --port 8001).
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d --build
#   INTEGRATION_TESTS=1 uv run pytest tests/integration/ -v
#   docker compose -f docker-compose.test.yml down -v

services:
  agents-memory-test:
    build: .
    network_mode: host
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8001
    environment:
      - DATABASE_URL=sqlite:///./data/test.db
      - QDRANT_HOST=localhost
      - QDRANT_PORT=6334
      - QDRANT_COLLECTION=test_memory
      - EMBEDDING_PROVIDER=ollama
      - EMBEDDING_MODEL=nomic-embed-text
      - EMBEDDING_DIMENSION=768
      - OLLAMA_HOST=http://localhost:11434
      - BUFFER_RETENTION_DAYS=7
      - LOG_LEVEL=INFO
    volumes:
      - test_data:/app/data
    restart: "no"

  qdrant-test:
    image: qdrant/qdrant:latest
    ports:
      - "6334:6333"
    volumes:
      - test_qdrant:/qdrant/storage
    restart: "no"

volumes:
  test_data:
  test_qdrant:
