stages:
  - verify
  - integration
  - build
  - publish

.ci_relevant_changes: &ci_relevant_changes
  - .gitlab-ci.yml
  - Dockerfile
  - docker-compose*.yml
  - pyproject.toml
  - uv.lock
  - alembic/**
  - src/**
  - tests/**
  - cli/**
  - scripts/**
  - Makefile

default:
  tags:
    - docker

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'

python_tests:
  stage: verify
  script:
    - uv sync --frozen --extra dev
    - uv run python -m pytest tests/test_services/ tests/test_api/ -v
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
      changes: *ci_relevant_changes

cli_tests:
  stage: verify
  script:
    - cd cli
    - go test ./...
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
      changes: *ci_relevant_changes

integration_postgres:
  stage: integration
  needs:
    - python_tests
    - cli_tests
  script:
    - export OLLAMA_HOST="${OLLAMA_HOST:-https://ollama.mmz.sh}"
    - uv sync --frozen --extra dev
    - docker compose -f docker-compose.test.postgres.yml up -d --build
    - INTEGRATION_TESTS=1 MEMORY_API_URL=http://127.0.0.1:8002 uv run python -m pytest tests/integration/ -k "not auth" -v
    - cd cli
    - go build -o dist/memory .
    - cd ..
    - MEMORY_API_URL=http://127.0.0.1:8002 CLI_BIN=./cli/dist/memory ./scripts/ci_smoke.sh
  after_script:
    - docker compose -f docker-compose.test.postgres.yml down -v
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
      changes: *ci_relevant_changes

build_cli_artifact:
  stage: build
  needs:
    - python_tests
    - cli_tests
  script:
    - cd cli
    - mkdir -p dist
    - go build -o dist/memory .
    - tar -C dist -czf "dist/memory-cli-linux-amd64-${CI_COMMIT_SHORT_SHA}.tar.gz" memory
  artifacts:
    name: "memory-cli-${CI_COMMIT_SHORT_SHA}"
    paths:
      - cli/dist/memory
      - cli/dist/memory-cli-linux-amd64-*.tar.gz
    expire_in: 14 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: *ci_relevant_changes

publish_image:
  stage: publish
  needs:
    - job: build_cli_artifact
      optional: true
    - job: integration_postgres
      optional: true
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        docker pull "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      else
        docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
      fi
    - printf "IMAGE_REF=%s\nIMAGE_TAG=%s\n" "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" "$CI_COMMIT_SHA" > build.env
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        printf "CLI_ARTIFACT_URL=%s/api/v4/projects/%s/packages/generic/memory-cli/%s/memory-cli-linux-amd64-%s.tar.gz\n" "$CI_SERVER_URL" "$CI_PROJECT_ID" "$CI_COMMIT_TAG" "$CI_COMMIT_TAG" >> build.env
      fi
  artifacts:
    reports:
      dotenv: build.env
  rules:
    - if: $CI_COMMIT_TAG
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: *ci_relevant_changes

publish_cli_package:
  stage: publish
  script:
    - |
      cd cli
      mkdir -p dist
      go build -o dist/memory .
      tar -C dist -czf "dist/memory-cli-linux-amd64-${CI_COMMIT_TAG}.tar.gz" memory
      curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "dist/memory-cli-linux-amd64-${CI_COMMIT_TAG}.tar.gz" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/memory-cli/${CI_COMMIT_TAG}/memory-cli-linux-amd64-${CI_COMMIT_TAG}.tar.gz"
  rules:
    - if: $CI_COMMIT_TAG
