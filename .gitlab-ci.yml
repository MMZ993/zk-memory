stages:
  - verify
  - integration
  - build
  - publish

.ci_relevant_changes: &ci_relevant_changes
  - .gitlab-ci.yml
  - Dockerfile
  - docker-compose*.yml
  - pyproject.toml
  - uv.lock
  - alembic/**
  - src/**
  - tests/**
  - cli/**
  - scripts/**
  - Makefile

default:
  tags:
    - docker

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'

python_tests:
  stage: verify
  script:
    - uv sync --frozen --extra dev
    - uv run python -m pytest tests/test_services/ tests/test_api/ -v
  rules:
    - if: $CI_COMMIT_TAG
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
      changes: *ci_relevant_changes

cli_tests:
  stage: verify
  script:
    - cd cli
    - go test ./...
  rules:
    - if: $CI_COMMIT_TAG
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
      changes: *ci_relevant_changes

integration_postgres:
  stage: integration
  needs:
    - python_tests
    - cli_tests
  script:
    - export OLLAMA_HOST="${OLLAMA_HOST:-https://ollama.mmz.sh}"
    - uv sync --frozen --extra dev
    - docker compose -f docker-compose.test.postgres.yml up -d --build
    - INTEGRATION_TESTS=1 MEMORY_API_URL=http://127.0.0.1:8002 uv run python -m pytest tests/integration/ -k "not auth" -v
    - cd cli
    - go build -o dist/memory .
    - cd ..
    - MEMORY_API_URL=http://127.0.0.1:8002 CLI_BIN=./cli/dist/memory ./scripts/ci_smoke.sh
  after_script:
    - docker compose -f docker-compose.test.postgres.yml logs --timestamps --no-color > integration-postgres-compose.log || true
    - docker compose -f docker-compose.test.postgres.yml down -v
  artifacts:
    when: always
    paths:
      - integration-postgres-compose.log
    expire_in: 14 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
      changes: *ci_relevant_changes

integration_import:
  stage: integration
  needs:
    - python_tests
    - cli_tests
  script:
    - export IMPORT_E2E_PROJECT="zk-memory-import-e2e-${CI_JOB_ID}"
    - uv sync --frozen --extra dev
    - make test-integration-import
  after_script:
    - test -s import-e2e-compose.log || docker compose -p "zk-memory-import-e2e-${CI_JOB_ID}" -f docker-compose.test.import.yml logs --timestamps --no-color > import-e2e-compose.log || true
    - docker compose -p "zk-memory-import-e2e-${CI_JOB_ID}" -f docker-compose.test.import.yml down -v
  artifacts:
    when: always
    paths:
      - import-e2e-compose.log
    expire_in: 14 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
      changes: *ci_relevant_changes

build_cli_artifact:
  stage: build
  needs:
    - python_tests
    - cli_tests
  script:
    - cd cli
    - mkdir -p dist
    - go build -o dist/memory .
    - tar -C dist -czf "dist/memory-cli-linux-amd64-${CI_COMMIT_SHORT_SHA}.tar.gz" memory
  artifacts:
    name: "memory-cli-${CI_COMMIT_SHORT_SHA}"
    paths:
      - cli/dist/memory
      - cli/dist/memory-cli-linux-amd64-*.tar.gz
    expire_in: 14 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: *ci_relevant_changes

publish_image:
  stage: publish
  needs:
    - job: build_cli_artifact
      optional: true
    - job: integration_postgres
      optional: true
    - integration_import
  script:
    - bash ./scripts/ci_publish_image.sh
  artifacts:
    reports:
      dotenv: build.env
  rules:
    - if: $CI_COMMIT_TAG
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: *ci_relevant_changes

publish_cli_package:
  stage: publish
  script:
    - bash ./scripts/ci_publish_cli_package.sh
  rules:
    - if: $CI_COMMIT_TAG
