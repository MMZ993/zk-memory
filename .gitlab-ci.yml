stages:
  - verify
  - integration
  - build
  - publish

default:
  tags:
    - docker

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

python_tests:
  stage: verify
  script:
    - uv sync --frozen --extra dev
    - uv run python -m pytest tests/test_services/ tests/test_api/ -v
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

cli_tests:
  stage: verify
  script:
    - cd cli
    - go test ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

integration_postgres:
  stage: integration
  needs:
    - python_tests
    - cli_tests
  script:
    - export OLLAMA_HOST="${OLLAMA_HOST:-https://ollama.mmz.sh}"
    - uv sync --frozen --extra dev
    - docker compose -f docker-compose.test.postgres.yml up -d --build
    - INTEGRATION_TESTS=1 MEMORY_API_URL=http://localhost:8002 uv run python -m pytest tests/integration/ -k "not auth" -v
    - cd cli
    - go build -o dist/memory .
    - cd ..
    - MEMORY_API_URL=http://localhost:8002 CLI_BIN=./cli/dist/memory ./scripts/ci_smoke.sh
  after_script:
    - docker compose -f docker-compose.test.postgres.yml down -v
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

build_cli_artifact:
  stage: build
  needs:
    - python_tests
    - cli_tests
  script:
    - cd cli
    - mkdir -p dist
    - go build -o dist/memory .
    - tar -C dist -czf "dist/memory-cli-linux-amd64-${CI_COMMIT_SHORT_SHA}.tar.gz" memory
  artifacts:
    name: "memory-cli-${CI_COMMIT_SHORT_SHA}"
    paths:
      - cli/dist/memory
      - cli/dist/memory-cli-linux-amd64-*.tar.gz
    expire_in: 14 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

publish_image:
  stage: publish
  needs:
    - build_cli_artifact
    - integration_postgres
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - |
      if [ -n "${CI_COMMIT_BRANCH:-}" ]; then
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
      fi
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      fi
    - printf "IMAGE_REF=%s\nIMAGE_TAG=%s\n" "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" "$CI_COMMIT_SHA" > build.env
  artifacts:
    reports:
      dotenv: build.env
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
