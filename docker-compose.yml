version: '3.8'

services:
  agents-memory:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DB_BACKEND=sqlite
      - DATABASE_URL=sqlite:///./data/memory.db
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-}
      - CORS_ALLOW_ORIGIN_REGEX=${CORS_ALLOW_ORIGIN_REGEX:-^https?://(localhost|127\.0\.0\.1)(:\d+)?$}
      - CORS_ALLOW_METHODS=${CORS_ALLOW_METHODS:-*}
      - CORS_ALLOW_HEADERS=${CORS_ALLOW_HEADERS:-*}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=notes_embeddings
      - EMBEDDING_MODEL=nomic-embed-text
      - EMBEDDING_DIMENSION=768
      - EMBEDDING_TASK_PREFIX=true
      - OLLAMA_HOST=http://host.docker.internal:11434
      - NOTE_MAX_CONTENT_LENGTH=2048
      - BUFFER_RETENTION_DAYS=7
      - MARKDOWN_DIR=./data/notes
      - LOG_LEVEL=INFO
      - MEMORY_API_KEY_READ=${MEMORY_API_KEY_READ:-}
      - MEMORY_API_KEY_BUFFER=${MEMORY_API_KEY_BUFFER:-}
      - MEMORY_API_KEY_WRITE=${MEMORY_API_KEY_WRITE:-}
      - MEMORY_API_KEY_DUMP=${MEMORY_API_KEY_DUMP:-}
      - MEMORY_API_KEY_ADMIN=${MEMORY_API_KEY_ADMIN:-}
    volumes:
      - ./data:/app/data
    depends_on:
      - qdrant
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant@sha256:94728574965d17c6485dd361aa3c0818b325b9016dac5ea6afec7b4b2700865f
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped
