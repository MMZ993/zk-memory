[project]
name = "agents-memory"
version = "1.0.0"
description = "A long-term memory system for AI agents inspired by Zettelkasten note-taking method"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.0",
    "uvicorn[standard]>=0.41.0",
    "python-multipart>=0.0.22",
    "sqlalchemy>=2.0.48",
    "alembic>=1.18.0",
    "qdrant-client>=1.17.0",
    "openai>=2.26.0",
    "python-dotenv>=1.2.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.13.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "black>=26.0.0",
    "isort>=8.0.0",
    "mypy>=1.19.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "."]
markers = [
    "integration: marks tests as integration tests requiring real Qdrant + Ollama (run with INTEGRATION_TESTS=1)",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
